overview: "A Netflix-style discovery tab for Jellyfin, backed by TMDB with requests via Overseerr/Jellyseerr"
description: >
  Reko adds a Reko tab to the Jellyfin home page, sitting beside Home and Favorites.

  It is a catalogue browser, not a library browser: it browses TMDB and uses your Jellyfin library only
  for "In library" badges, one-click playback, continue watching and personalisation.

  Features include a rotating hero billboard, horizontally scrolling rails, ranked Top 10 rows, curated
  genre rails, instant search and full title pages with seasons, episodes, cast, trailers
  and watch providers. Requests are routed through Overseerr or Jellyseerr with a season picker and live
  request status.

  Requests are per user: Reko maps the signed-in Jellyfin user to their Seerr account automatically.
