---
name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, without the leading v"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Set up .NET"
        uses: "actions/setup-dotnet@v4"
        with:
          dotnet-version: "10.0.x"

      - name: "Set up Node"
        uses: "actions/setup-node@v4"
        with:
          node-version: "22"

      # The version comes from the tag rather than from build.yaml, because build.yaml is the file
      # that gets edited to prepare a release and is therefore the one most likely to be wrong at the
      # moment the tag is pushed. The tag is the thing being released, so it is the authority.
      - name: "Read the version"
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.tag }}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}"

      - name: "Check the client modules"
        run: "node tools/check-client.mjs"

      - name: "Restore"
        run: "dotnet restore Jellyfin.Plugin.Reko.sln"

      - name: "Test"
        run: "dotnet test Jellyfin.Plugin.Reko.sln -c Release --no-restore"

      - name: "Publish"
        run: |
          dotnet publish Jellyfin.Plugin.Reko/Jellyfin.Plugin.Reko.csproj \
            -c Release -f net10.0 --no-restore \
            -p:Version="${{ steps.version.outputs.version }}" \
            -p:PublishDir="$PWD/artifact/"

      # Jellyfin installs a plugin from a zip whose root holds the assembly.
      # <repo>_<version>.zip is the naming the official repository's manifest uses, and it is the
      # name the release shows up under in the dashboard.
      # meta.json is generated rather than copied from manifest.json: the two carry the same fields
      # in different shapes, and the array form installs fine and then fails to reconcile.
      - name: "Package"
        id: package
        run: |
          set -euo pipefail
          mkdir -p staging
          cp artifact/Jellyfin.Plugin.Reko.dll staging/
          cp artifact/Jellyfin.Plugin.Reko.pdb staging/
          python3 tools/build-package-meta.py \
            "${{ steps.version.outputs.version }}" manifest.json staging/meta.json
          cd staging
          zip -r "../reko_${{ steps.version.outputs.version }}.zip" .
          cd ..

          zip="reko_${{ steps.version.outputs.version }}.zip"
          echo "md5=$(md5sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -l "$zip"

      - name: "Create the release"
        uses: "softprops/action-gh-release@v2"
        with:
          name: "Reko ${{ steps.version.outputs.version }}"
          tag_name: "${{ steps.version.outputs.tag }}"
          body_path: "CHANGELOG.md"
          fail_on_unmatched_files: false
          files: "reko_${{ steps.version.outputs.version }}.zip"

      # main:manifest.json is the source of truth and may describe versions that have no artifact
      # yet; gh-pages:manifest.json is what Jellyfin reads, and carries only released ones, each with
      # the sourceUrl and checksum that cannot be known before the zip exists. So the new version's
      # metadata is copied across from main and only those two fields are added here.
      #
      # Reading gh-pages' own copy and appending to it, rather than rewriting it from main, is what
      # keeps an unreleased version from being offered with no artifact behind it.
      - name: "Update the repository manifest"
        env:
          VERSION: "${{ steps.version.outputs.version }}"
          MD5: "${{ steps.package.outputs.md5 }}"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main gh-pages

          # Both are read out of the object store: the checkout is on the tag, and gh-pages holds
          # only the published manifest.
          git show "origin/main:manifest.json" > "$RUNNER_TEMP/main-manifest.json"
          mkdir -p published
          if git show "origin/gh-pages:manifest.json" > published/manifest.json 2> /dev/null; then
            echo "appending to the existing published manifest"
          else
            echo '[]' > published/manifest.json
          fi

          # Copied out before the checkout below, which replaces the working tree.
          cp -r tools "$RUNNER_TEMP/reko-tools"
          python3 "$RUNNER_TEMP/reko-tools/set-manifest-release.py" publish \
            "$VERSION" "$MD5" "$RUNNER_TEMP/main-manifest.json" published/manifest.json

          git checkout gh-pages
          cp published/manifest.json manifest.json
          git commit -am "Publish Reko $VERSION"
          git push origin gh-pages
